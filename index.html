<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>At All Cost - Migration PHP</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 720px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
        }

        code {
            color: #ffc000;
        }
    </style>
</head>
<body>
<main>
    <h1>Source publique migrée</h1>
    <p>Le site est désormais servi par le front controller PHP <code>api/index.php</code>.</p>
    <p>La page d'accueil a été déplacée dans <code>app/Views/public/home.php</code> et les assets applicatifs dans <code>public/assets/</code>.</p>
</main>
